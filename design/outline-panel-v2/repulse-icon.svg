<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="glow-pink" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    
    <filter id="glow-cyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    
    <clipPath id="sweep">
      <rect id="sweep-rect" x="-128" y="0" width="128" height="128"></rect>
    </clipPath>
  </defs>

  
  <path d="M 38,16 C 14,16 9,40 9,64 C 9,88 14,112 38,112" fill="none" stroke="#e94560" stroke-width="7.5" stroke-linecap="round" filter="url(#glow-pink)"></path>

  
  <path d="M 90,16 C 114,16 119,40 119,64 C 119,88 114,112 90,112" fill="none" stroke="#e94560" stroke-width="7.5" stroke-linecap="round" filter="url(#glow-pink)"></path>

  
  <path d="M 36,64 L 50,64 L 56,41 L 61,80 L 66,64 L 92,64" fill="none" stroke="#56b6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"></path>

  
  <g clip-path="url(#sweep)" filter="url(#glow-cyan)">
    <path d="M 36,64 L 50,64 L 56,41 L 61,80 L 66,64 L 92,64" fill="none" stroke="#56b6c2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>

  
  <circle id="cursor" cx="36" cy="64" r="2.2" fill="#56b6c2" filter="url(#glow-cyan)" opacity="0.9"></circle>
</svg>